name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: echo '{"jsonrpc":"2.0","id":1,"method":"initialize"}' | node bin/mcpwhitelist.mjs --mcp | grep -q '"mcpwhitelist"'
